[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronicle"
version = "0.1.0"
description = "Temporal memory and reasoning toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Opustron" }]
dependencies = [
  "pydantic>=2.6",
  "python-dateutil>=2.9",
  "dateparser>=1.2",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "icalendar>=5.0",
  "rapidfuzz>=3.6",
  # Name/organisation/place detection for the privacy router (chronicle.guard).
  "presidio-analyzer>=2.2",
  "spacy>=3.8,<3.9",
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["chronicle"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
